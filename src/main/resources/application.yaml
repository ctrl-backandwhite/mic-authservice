server:
  server-header: ""
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

nx:
  security:
    gateway-filter:
      enabled: false

spring:
  application:
    name: mic-authservice
  banner:
    charset: UTF-8
  profiles:
    active: ${PROFILE:local},kibana
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=600s
