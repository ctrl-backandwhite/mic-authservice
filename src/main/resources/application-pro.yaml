spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    show-sql: true
  liquibase:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUE_URL}
server:
  port: 8080
  ssl:
    enabled: false
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: none
        secure: true
        http-only: true
        max-age: 1800

app:
  security:
    handler-url-1: https://backandwhite.com/dashboard
    handler-url-2: https://webapp-production-68d2.up.railway.app
  jwt:
    secret: 7f3b9e2a1c8d4f6e0b5a3c7d9e1f2b4a6c8e0d2f4b6a8c0e2d4f6b8a0c2e4f6

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.springframework.security.web: DEBUG
    com.backandwhite: DEBUG

