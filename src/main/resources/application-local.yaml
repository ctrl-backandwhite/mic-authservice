server:
  port: ${SERVER_PORT:6001}
  forward-headers-strategy: FRAMEWORK
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:password}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
  servlet:
    session:
      cookie:
        same-site: ${SERVER_COOKIE_SAME_SITE:lax}
        secure: ${SERVER_COOKIE_SECURE:false}
        http-only: true

spring:
  datasource:
    url: jdbc:postgresql://caboose.proxy.rlwy.net:56135/railway
    username: postgres
    password: HzqtSlLQcwdwWbPaKSelEdvsnUuKbhSo
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  liquibase:
    enabled: true
  kafka:
    bootstrap-servers: crossover.proxy.rlwy.net:32058
    properties:
      schema.registry.url: http://schema-registry-sbs4-desarollo.up.railway.app
      basic.auth.credentials.source: USER_INFO
      basic.auth.user.info: admin:admin123
    enabled: true
    consumer:
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
      timeout: ${REDIS_TIMEOUT:60000}

app:
  security:
    handler-url: ${HANDLER_URL:http://localhost:9000/nexa-auth}
  activation:
    base-url: ${ACTIVATION_BASE_URL:http://localhost:9000}
  jwt:
    secret: ${JWT_SECRET:local-secret-key-change-me-in-production-must-be-256-bits-long}

logging:
  level:
    root: INFO
    "[org.springframework.security.oauth2]": TRACE
    "[org.springframework.security.web]": DEBUG
