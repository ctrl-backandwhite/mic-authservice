server:
  port: ${SERVER_PORT:6001}
  forward-headers-strategy: FRAMEWORK
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:password}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
  servlet:
    session:
      cookie:
        same-site: ${SERVER_COOKIE_SAME_SITE:lax}
        secure: ${SERVER_COOKIE_SECURE:false}
        http-only: true

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${AUTH_DATA_BASE:jdbc:postgresql://localhost:5401/db01}
    username: ${AUTH_DATA_USER:user01}
    password: ${AUTH_DATA_PASSWORD:pass01}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  liquibase:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
      timeout: ${REDIS_TIMEOUT:60000}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope: openid,profile,email
          x:
            # X (Twitter) OAuth 2.0 with PKCE. Create an app at
            # https://developer.x.com → "User authentication settings" → set
            # the callback URL to http://localhost:9000/login/oauth2/code/x
            # and copy the OAuth 2.0 client id/secret into the env vars below.
            client-id: ${X_CLIENT_ID:your-x-client-id}
            client-secret: ${X_CLIENT_SECRET:your-x-client-secret}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: tweet.read,users.read,offline.access
            client-name: X
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-name-attribute: email
          x:
            authorization-uri: https://x.com/i/oauth2/authorize
            token-uri: https://api.x.com/2/oauth2/token
            # The plain v2 user info endpoint. The response wraps user data
            # under {"data": {...}}; XOAuth2UserService fetches it directly,
            # flattens the data object and injects a synthetic "email" so the
            # downstream JWT customizer (which looks users up by email) can
            # locate the row created during sign-in.
            user-info-uri: https://api.x.com/2/users/me
            user-name-attribute: email

app:
  security:
    handler-url: ${HANDLER_URL:http://localhost:9000/}
    issuer: ${AUTH_ISSUER:http://localhost:9000}
  activation:
    base-url: ${ACTIVATION_BASE_URL:http://localhost:9000}
  jwt:
    secret: ${JWT_SECRET:local-secret-key-change-me-in-production-must-be-256-bits-long}

logging:
  level:
    root: INFO
    "[org.springframework.security.oauth2]": TRACE
    "[org.springframework.security.web]": DEBUG
