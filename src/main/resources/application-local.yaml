server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: password
    key-store-type: PKCS12
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
        http-only: true

spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  liquibase:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8443
app:
  security:
    handler-url: http://localhost:4200

logging:
  level:
    root: INFO
    org.springframework.security.oauth2: TRACE
    org.springframework.security.web: DEBUG