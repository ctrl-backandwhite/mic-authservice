server:
  port: ${SERVER_PORT:6001}
  forward-headers-strategy: FRAMEWORK
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:password}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
  servlet:
    session:
      cookie:
        same-site: ${SERVER_COOKIE_SAME_SITE:lax}
        secure: ${SERVER_COOKIE_SECURE:false}
        http-only: true

spring:
  datasource:
    url: ${AUTH_DATA_BASE:jdbc:postgresql://localhost:5401/db01}
    username: ${AUTH_DATA_USER:user01}
    password: ${AUTH_DATA_PASSWORD:pass01}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  liquibase:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    enabled: true
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
      basic.auth.credentials.source: USER_INFO
      basic.auth.user.info: ${SCHEMA_REGISTRY_AUTH:admin:admin123}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
      timeout: ${REDIS_TIMEOUT:60000}

app:
  security:
    handler-url: ${HANDLER_URL:http://localhost:9000/nexa-auth}
  activation:
    base-url: ${ACTIVATION_BASE_URL:http://localhost:9000}
  jwt:
    secret: ${JWT_SECRET:local-secret-key-change-me-in-production-must-be-256-bits-long}

logging:
  level:
    root: INFO
    "[org.springframework.security.oauth2]": TRACE
    "[org.springframework.security.web]": DEBUG
