spring:
  profiles:
    include: kibana
  datasource:
    url: jdbc:postgresql://postgres-c4jk.railway.internal:5432/railway
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    show-sql: true
  liquibase:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.railway.internal:9092}
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:https://gateway-service-des.up.railway.app}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 1

server:
  port: 8080
  ssl:
    enabled: false
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: lax
        secure: true
        http-only: true
        max-age: 1800

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG

app:
  security:
    handler-url: https://nx036.com/nexa-auth
  activation:
    base-url: ${ACTIVATION_BASE_URL:https://nx036.com}
  jwt:
    secret: ${JWT_SECRET}

