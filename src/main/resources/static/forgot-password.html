<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="forgot.pageTitle">¿Olvidaste tu contraseña?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/login.css?v=20260325" />
</head>

<body>
    <main class="login-page login">
        <section class="login-card">
            <div class="login-card__media" aria-hidden="true">
                <div class="media__overlay"></div>
                <div class="media__content">
                    <span class="logo">Back &amp; White</span>
                    <div class="media__quote">
                        <p id="quote-text" data-i18n="forgot.quote">Sistemas inteligentes para una experiencia fluida.
                        </p>
                    </div>
                    <div class="media__dots" id="quote-dots">
                        <span class="is-active"></span><span></span><span></span><span></span>
                    </div>
                </div>
            </div>

            <div class="login-card__content">
                <header class="content__header">
                    <h1 data-i18n="forgot.title">¿Olvidaste tu contraseña?</h1>
                    <p data-i18n="forgot.subtitle">Ingresa tu correo y vuelve al login para continuar.</p>
                </header>

                <form id="forgotForm" class="form" novalidate>
                    <label class="field">
                        <span data-i18n="forgot.emailLabel">Correo electrónico</span>
                        <input type="email" name="email" autocomplete="email" placeholder="Ingresa tu correo"
                            data-i18n-placeholder="forgot.emailPlaceholder" required />
                    </label>

                    <button type="submit" class="btn btn--primary" data-i18n="forgot.submit">Enviar
                        instrucciones</button>
                </form>

                <p class="signup"><span data-i18n="forgot.remembered">¿Recordaste tu contraseña?</span>
                    <a class="link" href="/login" data-i18n="forgot.loginLink">Inicia sesión</a>
                </p>
            </div>
        </section>
    </main>

    <script>
        (function () {
            var translations = {
                es: {
                    "forgot.pageTitle": "¿Olvidaste tu contraseña?",
                    "forgot.quote": "Sistemas inteligentes para una experiencia fluida.",
                    "forgot.title": "¿Olvidaste tu contraseña?",
                    "forgot.subtitle": "Ingresa tu correo y vuelve al login para continuar.",
                    "forgot.emailLabel": "Correo electrónico",
                    "forgot.emailPlaceholder": "Ingresa tu correo",
                    "forgot.submit": "Enviar instrucciones",
                    "forgot.remembered": "¿Recordaste tu contraseña?",
                    "forgot.loginLink": "Inicia sesión",
                    quotes: [
                        "Sistemas inteligentes para una experiencia fluida.",
                        "Flujos digitales optimizados para el mañana.",
                        "Conexiones seguras en un entorno futurista.",
                        "Tecnología avanzada con interacción sencilla."
                    ]
                },
                en: {
                    "forgot.pageTitle": "Forgot your password?",
                    "forgot.quote": "Intelligent systems for a seamless experience.",
                    "forgot.title": "Forgot your password?",
                    "forgot.subtitle": "Enter your email and return to login to continue.",
                    "forgot.emailLabel": "Email",
                    "forgot.emailPlaceholder": "Enter your email",
                    "forgot.submit": "Send instructions",
                    "forgot.remembered": "Remembered your password?",
                    "forgot.loginLink": "Sign in",
                    quotes: [
                        "Intelligent systems for a seamless experience.",
                        "Optimized digital flows for tomorrow.",
                        "Secure connections in a futuristic environment.",
                        "Advanced technology with simple interaction."
                    ]
                }
            };

            function applyTranslations(lang) {
                var dict = translations[lang] || translations.es;
                document.querySelectorAll("[data-i18n]").forEach(function (el) {
                    var key = el.getAttribute("data-i18n");
                    if (dict[key]) {
                        el.textContent = dict[key];
                    }
                });
                document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
                    var key = el.getAttribute("data-i18n-placeholder");
                    if (dict[key]) {
                        el.setAttribute("placeholder", dict[key]);
                    }
                });
            }

            var currentLang = localStorage.getItem("lang") || "es";
            var quoteInterval;

            function startQuotes(lang) {
                var dict = translations[lang] || translations.es;
                var quotes = dict.quotes || [];
                var index = 0;
                var el = document.getElementById("quote-text");
                var quoteBox = document.querySelector(".media__quote");
                var dots = document.querySelectorAll("#quote-dots span");
                if (!el || !quotes.length) return;
                el.textContent = quotes[0];
                if (quoteInterval) clearInterval(quoteInterval);
                quoteInterval = setInterval(function () {
                    if (quoteBox) quoteBox.classList.add("fade-out");
                    if (dots.length) {
                        dots.forEach(function (dot) {
                            dot.classList.add("fade-out");
                        });
                    }
                    setTimeout(function () {
                        index = (index + 1) % quotes.length;
                        el.textContent = quotes[index];
                        if (dots.length) {
                            dots.forEach(function (dot, i) {
                                dot.classList.toggle("is-active", i === index % dots.length);
                                dot.classList.remove("fade-out");
                            });
                        }
                        if (quoteBox) quoteBox.classList.remove("fade-out");
                    }, 200);
                }, 3000);
            }

            function setLanguage(lang) {
                document.documentElement.setAttribute("lang", lang);
                localStorage.setItem("lang", lang);
                applyTranslations(lang);
                startQuotes(lang);
                document.querySelectorAll(".lang-switch__btn").forEach(function (btn) {
                    btn.classList.toggle("is-active", btn.getAttribute("data-lang") === lang);
                });
            }

            document.querySelectorAll(".lang-switch__btn").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    setLanguage(btn.getAttribute("data-lang"));
                });
            });

            setLanguage(currentLang);

            var form = document.getElementById("forgotForm");
            if (!form) return;
            form.addEventListener("submit", function (event) {
                event.preventDefault();
                var emailInput = form.querySelector('input[name="email"]');
                var email = emailInput ? emailInput.value.trim() : '';
                if (!email) return;

                var btn = form.querySelector('button[type="submit"]');
                if (btn) { btn.disabled = true; btn.textContent = 'Enviando...'; }

                fetch('/api/v1/users/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                })
                    .then(function () {
                        form.innerHTML =
                            '<div style="text-align:center;padding:24px 0;">' +
                            '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#19b3a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:12px;">' +
                            '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' +
                            '<h2 style="font-weight:500;font-size:18px;margin-bottom:8px;">¡Correo enviado!</h2>' +
                            '<p style="color:#7a8796;font-size:14px;line-height:1.6;">Si existe una cuenta asociada a <strong>' +
                            email.replace(/</g, '&lt;').replace(/>/g, '&gt;') +
                            '</strong>, recibirás un enlace para restablecer tu contraseña.</p>' +
                            '<a href="/login.html" class="btn btn--primary" style="margin-top:20px;display:inline-block;text-decoration:none;">Volver al login</a>' +
                            '</div>';
                    })
                    .catch(function () {
                        if (btn) { btn.disabled = false; btn.textContent = 'Enviar instrucciones'; }
                    });
            });
        })();
    </script>
</body>

</html>
