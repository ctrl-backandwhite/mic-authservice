<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="register.pageTitle">Crear cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/register.css?v=20260216" />
</head>

<body>
    <main class="register-page">
        <section class="register-card">
            <div class="register-card__media" aria-hidden="true">
                <div class="media__overlay"></div>
                <div class="media__content">
                    <span class="logo">Back &amp; White</span>
                    <div class="media__quote">
                        <p id="quote-text" data-i18n="register.quote">Únete a nosotros y disfruta de todas las
                            funcionalidades.</p>
                    </div>
                    <div class="media__dots" id="quote-dots">
                        <span class="is-active"></span><span></span><span></span>
                    </div>
                </div>
            </div>

            <div class="register-card__content">
                <header class="content__header">
                    <div class="alert" id="alert" style="display: none;"></div>
                </header>

                <form id="registerForm" class="form" novalidate>
                    <div class="form__row">
                        <label class="field">
                            <span data-i18n="register.nameLabel">Nombre *</span>
                            <input type="text" id="name" name="name" placeholder="Ingresa tu nombre"
                                data-i18n-placeholder="register.namePlaceholder" required minlength="2"
                                maxlength="100" />
                            <small class="error-message"></small>
                        </label>
                        <label class="field">
                            <span data-i18n="register.lastNameLabel">Apellido *</span>
                            <input type="text" id="lastName" name="lastName" placeholder="Ingresa tu apellido"
                                data-i18n-placeholder="register.lastNamePlaceholder" required minlength="2"
                                maxlength="100" />
                            <small class="error-message"></small>
                        </label>
                    </div>

                    <label class="field">
                        <span data-i18n="register.emailLabel">Correo Electrónico *</span>
                        <input type="email" id="email" name="email" autocomplete="email"
                            placeholder="Ingresa tu correo electrónico"
                            data-i18n-placeholder="register.emailPlaceholder" required />
                        <small class="error-message"></small>
                    </label>

                    <label class="field">
                        <span data-i18n="register.usernameLabel">Usuario</span>
                        <input type="text" id="nickName" name="nickName" autocomplete="username"
                            placeholder="Ingresa tu usuario (opcional)"
                            data-i18n-placeholder="register.usernamePlaceholder" minlength="3" maxlength="50" />
                        <small class="error-message"></small>
                    </label>

                    <div class="form__row">
                        <label class="field">
                            <span data-i18n="register.passwordLabel">Contraseña *</span>
                            <input type="password" id="password" name="password" autocomplete="new-password"
                                placeholder="Ingresa tu contraseña" data-i18n-placeholder="register.passwordPlaceholder"
                                required minlength="8" />
                            <small class="error-message"></small>
                        </label>
                        <label class="field">
                            <span data-i18n="register.confirmPasswordLabel">Confirmar Contraseña *</span>
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                autocomplete="new-password" placeholder="Confirma tu contraseña"
                                data-i18n-placeholder="register.confirmPasswordPlaceholder" required minlength="8" />
                            <small class="error-message"></small>
                        </label>
                    </div>

                    <div class="password-requirements">
                        <p data-i18n="register.passwordRequirements">La contraseña debe contener:</p>
                        <ul>
                            <li id="req-length" data-i18n="register.reqLength">Al menos 8 caracteres</li>
                            <li id="req-uppercase" data-i18n="register.reqUppercase">Una letra mayúscula</li>
                            <li id="req-lowercase" data-i18n="register.reqLowercase">Una letra minúscula</li>
                            <li id="req-number" data-i18n="register.reqNumber">Un número</li>
                        </ul>
                    </div>

                    <label class="checkbox">
                        <input type="checkbox" id="terms" name="terms" required />
                        <span><span data-i18n="register.acceptTerms">Acepto los</span>
                            <a href="/terms.html" class="link" target="_blank" data-i18n="register.termsLink">Términos y
                                Condiciones</a></span>
                    </label>

                    <button type="submit" class="btn btn--primary">
                        <span class="btn-text" data-i18n="register.submit">Crear Cuenta</span>
                        <span class="spinner" style="display: none;"></span>
                    </button>
                </form>

                <p class="signin"><span data-i18n="register.haveAccount">¿Ya tienes cuenta?</span>
                    <a class="link" href="/login" data-i18n="register.loginLink">Inicia sesión</a>
                </p>
            </div>
        </section>
    </main>

    <script>
        const translations = {
            es: {
                "register.pageTitle": "Crear cuenta",
                "register.quote": "Únete a nosotros y disfruta de todas las funcionalidades.",
                "register.nameLabel": "Nombre *",
                "register.namePlaceholder": "Ingresa tu nombre",
                "register.lastNameLabel": "Apellido *",
                "register.lastNamePlaceholder": "Ingresa tu apellido",
                "register.emailLabel": "Correo Electrónico *",
                "register.emailPlaceholder": "Ingresa tu correo electrónico",
                "register.usernameLabel": "Usuario",
                "register.usernamePlaceholder": "Ingresa tu usuario (opcional)",
                "register.passwordLabel": "Contraseña *",
                "register.passwordPlaceholder": "Ingresa tu contraseña",
                "register.confirmPasswordLabel": "Confirmar Contraseña *",
                "register.confirmPasswordPlaceholder": "Confirma tu contraseña",
                "register.passwordRequirements": "La contraseña debe contener:",
                "register.reqLength": "Al menos 8 caracteres",
                "register.reqUppercase": "Una letra mayúscula",
                "register.reqLowercase": "Una letra minúscula",
                "register.reqNumber": "Un número",
                "register.acceptTerms": "Acepto los",
                "register.termsLink": "Términos y Condiciones",
                "register.submit": "Crear Cuenta",
                "register.haveAccount": "¿Ya tienes cuenta?",
                "register.loginLink": "Inicia sesión",
                "register.passwordMismatch": "Las contraseñas no coinciden",
                "register.acceptTermsError": "Por favor acepta los Términos y Condiciones",
                "register.creatingAccount": "Creando cuenta...",
                "register.successMessage": "¡Cuenta creada exitosamente! Redirigiendo a iniciar sesión...",
                "register.createError": "No se pudo crear la cuenta. Por favor intenta de nuevo.",
                "register.genericError": "Ocurrió un error. Por favor intenta más tarde.",
                quotes: [
                    "Únete a nosotros y disfruta de todas las funcionalidades.",
                    "Gestiona tus proyectos de forma eficiente y segura.",
                    "Colabora con tu equipo en tiempo real.",
                    "Accede desde cualquier dispositivo, en cualquier momento."
                ]
            },
            en: {
                "register.pageTitle": "Create account",
                "register.quote": "Join us and enjoy all the features.",
                "register.nameLabel": "First name *",
                "register.namePlaceholder": "Enter your first name",
                "register.lastNameLabel": "Last name *",
                "register.lastNamePlaceholder": "Enter your last name",
                "register.emailLabel": "Email *",
                "register.emailPlaceholder": "Enter your email",
                "register.usernameLabel": "Username",
                "register.usernamePlaceholder": "Enter your username (optional)",
                "register.passwordLabel": "Password *",
                "register.passwordPlaceholder": "Enter your password",
                "register.confirmPasswordLabel": "Confirm Password *",
                "register.confirmPasswordPlaceholder": "Confirm your password",
                "register.passwordRequirements": "Your password must contain:",
                "register.reqLength": "At least 8 characters",
                "register.reqUppercase": "One uppercase letter",
                "register.reqLowercase": "One lowercase letter",
                "register.reqNumber": "One number",
                "register.acceptTerms": "I accept the",
                "register.termsLink": "Terms and Conditions",
                "register.submit": "Create Account",
                "register.haveAccount": "Already have an account?",
                "register.loginLink": "Sign in",
                "register.passwordMismatch": "Passwords do not match",
                "register.acceptTermsError": "Please accept the Terms and Conditions",
                "register.creatingAccount": "Creating account...",
                "register.successMessage": "Account created successfully! Redirecting to sign in...",
                "register.createError": "Couldn't create the account. Please try again.",
                "register.genericError": "Something went wrong. Please try again later.",
                quotes: [
                    "Join us and enjoy all the features.",
                    "Manage your projects efficiently and securely.",
                    "Collaborate with your team in real time.",
                    "Access from any device, anytime."
                ]
            }
        };

        let currentLang = localStorage.getItem('lang') || 'es';
        let quoteInterval;

        function t(key) {
            const dict = translations[currentLang] || translations.es;
            return dict[key] || key;
        }

        function applyTranslations(lang) {
            const dict = translations[lang] || translations.es;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) {
                    el.textContent = dict[key];
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (dict[key]) {
                    el.setAttribute('placeholder', dict[key]);
                }
            });
        }

        function startQuotes(lang) {
            const dict = translations[lang] || translations.es;
            const quotes = dict.quotes || [];
            let index = 0;
            const el = document.getElementById("quote-text");
            const quoteBox = document.querySelector(".media__quote");
            const dots = document.querySelectorAll("#quote-dots span");

            if (!el || !quotes.length) return;
            el.textContent = quotes[0];

            if (quoteInterval) clearInterval(quoteInterval);
            quoteInterval = setInterval(() => {
                if (quoteBox) quoteBox.classList.add("fade-out");
                if (dots.length) {
                    dots.forEach(dot => dot.classList.add("fade-out"));
                }
                setTimeout(() => {
                    index = (index + 1) % quotes.length;
                    el.textContent = quotes[index];
                    if (dots.length) {
                        dots.forEach((dot, i) => {
                            dot.classList.toggle("is-active", i === index % dots.length);
                            dot.classList.remove("fade-out");
                        });
                    }
                    if (quoteBox) quoteBox.classList.remove("fade-out");
                }, 200);
            }, 3000);
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.setAttribute('lang', lang);
            localStorage.setItem('lang', lang);
            applyTranslations(lang);
            startQuotes(lang);
            document.querySelectorAll('.lang-switch__btn').forEach(btn => {
                btn.classList.toggle('is-active', btn.getAttribute('data-lang') === lang);
            });
        }

        document.querySelectorAll('.lang-switch__btn').forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.getAttribute('data-lang')));
        });

        setLanguage(currentLang);

        // Password validation
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        passwordInput?.addEventListener('input', function () {
            const password = this.value;

            // Check length
            const lengthValid = password.length >= 8;
            toggleRequirement('req-length', lengthValid);

            // Check uppercase
            const uppercaseValid = /[A-Z]/.test(password);
            toggleRequirement('req-uppercase', uppercaseValid);

            // Check lowercase
            const lowercaseValid = /[a-z]/.test(password);
            toggleRequirement('req-lowercase', lowercaseValid);

            // Check number
            const numberValid = /[0-9]/.test(password);
            toggleRequirement('req-number', numberValid);
        });

        function toggleRequirement(id, isValid) {
            const element = document.getElementById(id);
            if (element) {
                element.style.color = isValid ? '#10b981' : '#94a3b8';
                element.style.fontWeight = isValid ? '500' : '300';
            }
        }

        // Form submission
        const form = document.getElementById('registerForm');
        form?.addEventListener('submit', async function (e) {
            e.preventDefault();

            // Clear previous errors
            clearErrors();

            // Get form data
            const formData = {
                name: document.getElementById('name').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                email: document.getElementById('email').value.trim(),
                nickName: document.getElementById('nickName').value.trim() || null,
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value,
                termsAccepted: document.getElementById('terms').checked,
                enabled: true,
                accountNonExpired: true,
                accountNonLocked: true,
                credentialsNonExpired: true,
                scopeIds: [],
                roleIds: [],
                groupIds: []
            };

            // Validar que las contraseñas coincidan
            if (formData.password !== formData.confirmPassword) {
                showFieldError('confirmPassword', t('register.passwordMismatch'));
                return;
            }

            // Validar términos
            if (!document.getElementById('terms').checked) {
                showAlert(t('register.acceptTermsError'), 'error');
                return;
            }

            // Mostrar cargando
            const btn = form.querySelector('button[type="submit"]');
            const btnText = btn.querySelector('.btn-text');
            const spinner = btn.querySelector('.spinner');
            btn.disabled = true;
            btnText.textContent = t('register.creatingAccount');
            spinner.style.display = 'inline-block';

            try {
                const response = await fetch('/api/v1/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    showAlert(t('register.successMessage'), 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    const error = await response.json();
                    showAlert(error.message || t('register.createError'), 'error');
                }
            } catch (error) {
                console.error('Error de registro:', error);
                showAlert(t('register.genericError'), 'error');
            } finally {
                btn.disabled = false;
                btnText.textContent = t('register.submit');
                spinner.style.display = 'none';
            }
        });

        function showFieldError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const errorEl = field?.parentElement.querySelector('.error-message');
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.style.display = 'block';
                field.classList.add('error');
            }
        }

        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.textContent = '';
                el.style.display = 'none';
            });
            document.querySelectorAll('.field input').forEach(input => {
                input.classList.remove('error');
            });
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert--${type}`;
            alert.style.display = 'block';
        }
    </script>
</body>

</html>
