<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cuenta activada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/login.css?v=20260325" />
</head>

<body class="status-page">
    <div class="status-card">
        <div class="status-card__header status-card__header--success">
            <div class="logo">NEXA</div>
            <div class="icon-circle">
                <svg viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
        </div>
        <div class="status-card__body">
            <h1>¡Cuenta activada!</h1>
            <p>Tu cuenta ha sido activada exitosamente. Ya puedes iniciar sesión con tus credenciales.</p>
            <div class="progress-bar">
                <div class="progress-bar__fill progress-bar__fill--success"></div>
            </div>
            <p class="countdown countdown--success">Redirigiendo al login en <span id="seconds">3</span> segundos...
            </p>
            <a class="btn--status" href="/login.html">Ir al login ahora</a>
        </div>
    </div>

    <script>
        (function () {
            var t = 3;
            var el = document.getElementById('seconds');
            var interval = setInterval(function () {
                t--;
                el.textContent = t;
                if (t <= 0) { clearInterval(interval); window.location.href = '/login.html'; }
            }, 1000);
        })();
    </script>
</body>

</html>
