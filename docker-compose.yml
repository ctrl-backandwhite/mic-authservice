services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mic-authservice:local
    restart: unless-stopped
    environment:
      PROFILE: local
      SERVER_PORT: 8080
      SSL_ENABLED: "false"
      SERVER_COOKIE_SECURE: "false"
      SERVER_COOKIE_SAME_SITE: lax
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5401/db01
      SPRING_DATASOURCE_USERNAME: user01
      SPRING_DATASOURCE_PASSWORD: pass01
      ISSUER_URI: http://localhost:9000
      HANDLER_URL: http://localhost:9000/nexa-auth
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
      REDIS_DATABASE: 1
      SPRING_KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
      # Kafka Schema Registry (Confluent Cloud)
      AUTH_SCHEMA_REGISTRY_URL: your-schema-registry-url
      AUTH_SCHEMA_REGISTRY_AUTH: your-key:your-secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6001:8080"
